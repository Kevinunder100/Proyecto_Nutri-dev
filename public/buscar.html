<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>¿Qué tienes en casa? - NutriChef</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <header class="navbar">
    <div class="container">
      <div class="nav-logo">
        <img src="img/logo.png">
        <span>Nutri</span>
      </div>

      <nav class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="menu.html">Recetas</a>
        <a href="planes.html">Planes</a>
        <a href="recursos.html">Recursos</a>
      </nav>

      <div class="nav-actions">
        <a href="login.html" class="btn btn-outline">Ingresar</a>
        <a href="registrar.html" class="btn btn-primary">Crear cuenta</a>
      </div>
    </div>
  </header>

  <main class="search-page">
    <div class="container">
      <div class="search-card">
        <h1 class="search-title">¿Qué tienes en casa? 🏡</h1>

        <div class="search-row">
          <div>
            <label for="buscar">Busca un platillo o ingrediente</label>
            <div class="search-input-wrapper">
              <input id="buscar" type="text" placeholder="Ej. pollo, pasta, ensalada..." />
            </div>
          </div>

          <div>
            <label>Tipo de receta</label>
            <div class="tag-filters">
              <button class="active" type="button">Todas</button>
              <button type="button">Platos Fuertes</button>
              <button type="button">Bebidas</button>
              <button type="button">Guarniciones</button>
              <button type="button">Postres</button>
            </div>
          </div>

          <div>
            <label>Elige los ingredientes que tienes disponibles</label>
            <div class="check-group">
              <!-- Cargado dinámicamente -->
            </div>
          </div>

          <div>
            <label>Tus ingredientes seleccionados:</label>
            <div class="search-tags"></div>
          </div>

          <div class="search-actions">
            <button class="btn btn-outline" id="clear-filters-btn" type="button">Limpiar filtros</button>
            <button class="btn btn-success" id="search-btn">Buscar recetas</button>
          </div>
        </div>
      </div>

      <!-- Resultados -->
      <section id="results-container" class="recipes-grid">
        <!-- Las tarjetas se llenan dinámicamente -->
      </section>
    </div>
  </main>
  <script>
    const searchInput = document.getElementById('buscar');
    const searchButton = document.getElementById('search-btn');
    const resultsContainer = document.getElementById('results-container');
    const categoryButtons = document.querySelectorAll('.tag-filters button');
    const checkGroup = document.querySelector('.check-group');
    const selectedTagsContainer = document.querySelector('.search-tags');

    let selectedCategory = "Todas";
    let selectedIngredients = [];

    // Initialize
    updateSelectedTags();
    loadIngredients();

    // Category Buttons Logic
    categoryButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        categoryButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedCategory = btn.textContent;
      });
    });

    async function loadIngredients() {
      try {
        const res = await fetch('/api/ingredients');
        const ingredients = await res.json();

        checkGroup.innerHTML = '';
        ingredients.forEach(ing => {
          const label = document.createElement('label');
          label.innerHTML = `<input type="checkbox" value="${ing}" /> ${ing}`;
          checkGroup.appendChild(label);

          label.querySelector('input').addEventListener('change', (e) => {
            const val = e.target.value;
            if (e.target.checked) {
              if (!selectedIngredients.includes(val)) selectedIngredients.push(val);
            } else {
              selectedIngredients = selectedIngredients.filter(i => i !== val);
            }
            updateSelectedTags();
          });
        });
      } catch (err) {
        console.error("Failed to load ingredients", err);
      }
    }

    function updateSelectedTags() {
      selectedTagsContainer.innerHTML = '';
      if (selectedIngredients.length === 0) {
        selectedTagsContainer.innerHTML = '<span style="color: #999; font-style: italic;">No has seleccionado ingredientes.</span>';
        return;
      }

      selectedIngredients.forEach(ing => {
        const chip = document.createElement('span');
        chip.className = 'ingredient-chip';
        chip.innerHTML = `${ing} <span class="close-btn" data-ing="${ing}">×</span>`;
        selectedTagsContainer.appendChild(chip);

        // Add click event to remove chip
        chip.querySelector('.close-btn').addEventListener('click', (e) => {
          const ingToRemove = e.target.getAttribute('data-ing');
          removeIngredient(ingToRemove);
        });
      });
    }

    function removeIngredient(ing) {
      selectedIngredients = selectedIngredients.filter(i => i !== ing);
      // Uncheck the checkbox
      const checkbox = Array.from(document.querySelectorAll('.check-group input')).find(cb => cb.value === ing);
      if (checkbox) checkbox.checked = false;
      updateSelectedTags();
    }

    async function searchRecipes() {
      const query = searchInput.value;
      const ingredientsParam = selectedIngredients.join(',');

      let url = `/api/recipes?search=${encodeURIComponent(query)}`;

      // Map user-friendly category to DB category prefix
      if (selectedCategory && selectedCategory !== "Todas") {
        let dbCategory = "";
        if (selectedCategory === "Platos Fuertes") dbCategory = "PF";
        else if (selectedCategory === "Bebidas") dbCategory = "B";
        else if (selectedCategory === "Guarniciones") dbCategory = "G";
        else if (selectedCategory === "Postres") dbCategory = "P"; // Matches "P AZÚCAR", "P FRUTA"

        if (dbCategory) {
          url += `&category=${encodeURIComponent(dbCategory)}`;
        }
      }

      if (ingredientsParam) {
        url += `&ingredients=${encodeURIComponent(ingredientsParam)}`;
      }

      try {
        const response = await fetch(url);
        const recipes = await response.json();
        displayResults(recipes);
      } catch (error) {
        console.error('Error searching recipes:', error);
      }
    }

    function displayResults(recipes) {
      resultsContainer.innerHTML = '';

      if (recipes.length === 0) {
        resultsContainer.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #666;">No se encontraron recetas que coincidan con tu búsqueda.</p>';
        return;
      }

      recipes.forEach(recipe => {
        const card = document.createElement('article');
        card.className = 'recipe-card';

        const title = document.createElement("h3");
        title.textContent = recipe.name;

        const meta = document.createElement("p");
        meta.className = "recipe-card-meta";
        meta.textContent = recipe.category || "Sin categoría";

        const servings = document.createElement("p");
        servings.className = "recipe-card-servings";
        if (recipe.servings && (recipe.servings.children || recipe.servings.adults)) {
          servings.textContent =
            (recipe.servings.children ? recipe.servings.children + " niño(s)" : "") +
            (recipe.servings.children && recipe.servings.adults ? " · " : "") +
            (recipe.servings.adults ? recipe.servings.adults + " adulto(s)" : "");
        } else {
          servings.textContent = "Porciones no especificadas";
        }

        const button = document.createElement("a");
        button.className = "btn btn-small";
        button.textContent = "Ver receta";
        button.href = "receta.html?slug=" + encodeURIComponent(recipe.slug);

        card.appendChild(title);
        card.appendChild(meta);
        card.appendChild(servings);
        card.appendChild(button);

        resultsContainer.appendChild(card);
      });
    }

    const clearButton = document.getElementById('clear-filters-btn');

    clearButton.addEventListener('click', () => {
      // Reset state
      searchInput.value = '';
      selectedCategory = "Todas";
      selectedIngredients = [];

      // Reset UI
      categoryButtons.forEach(b => b.classList.remove('active'));
      categoryButtons[0].classList.add('active'); // "Todas"

      const checkboxes = document.querySelectorAll('.check-group input[type="checkbox"]');
      checkboxes.forEach(cb => cb.checked = false);

      updateSelectedTags();
      resultsContainer.innerHTML = ''; // Clear results instead of searching
    });

    searchButton.addEventListener('click', searchRecipes);
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchRecipes();
    });
  </script>
  <script src="js/auth.js"></script>
</body>

</html>
