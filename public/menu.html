<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>NutriChef - Recetas</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header class="navbar">
    <div class="container">
      <div class="nav-logo">
        <img src="img/logo.png">
        <span>Nutri</span>
      </div>

      <nav class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="menu.html" class="active">Recetas</a>
        <a href="planes.html">Planes</a>
        <a href="recursos.html">Recursos</a>
      </nav>

      <div class="nav-actions">
        <a href="login.html" class="btn btn-outline">Log Out</a>
      </div>
    </div>
  </header>

  <div class="menu-hero">
    <div class="container">
      <div class="main-header">
        <h1>Explora las recetas de NutriChef</h1>
        <p>Elige una categoría para ver las recetas disponibles.</p>
      </div>
    </div>
  </div>

  <main class="main-page">
    <div class="container">

      <!-- Filtro de categoría -->
      <div class="category-filter">
        <label for="category-select">Categoría:</label>
        <select id="category-select">
          <option value="all">Todas las categorías</option>
        </select>
      </div>

      <!-- Grid de tarjetas -->
      <section id="recipes-grid" class="recipes-grid">
        <!-- Las tarjetas se llenan dinámicamente -->
      </section>
    </div>
  </main>

  <script>
    let allRecipes = [];

    async function loadRecipes() {
      try {
        const res = await fetch("/api/recipes");
        if (!res.ok) {
          console.error("Error fetching recipes:", res.status);
          return;
        }

        allRecipes = await res.json();
        populateCategoryFilter(allRecipes);
        renderRecipeCards(allRecipes, "all");
      } catch (err) {
        console.error("Unexpected error fetching recipes:", err);
      }
    }

    function populateCategoryFilter(recipes) {
      const select = document.getElementById("category-select");

      // Obtener categorías únicas (ignorando vacías)
      const categories = Array.from(
        new Set(
          recipes
            .map(r => r.category)
            .filter(Boolean)
        )
      ).sort();

      categories.forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        select.appendChild(opt);
      });

      select.addEventListener("change", () => {
        const value = select.value;
        renderRecipeCards(allRecipes, value);
      });
    }

    function renderRecipeCards(recipes, category) {
      const grid = document.getElementById("recipes-grid");
      grid.innerHTML = "";

      const filtered =
        category === "all"
          ? recipes
          : recipes.filter(r => r.category === category);

      if (filtered.length === 0) {
        grid.innerHTML = "<p>No hay recetas en esta categoría.</p>";
        return;
      }

      filtered.forEach(recipe => {
        const card = document.createElement("article");
        card.className = "recipe-card";

        const title = document.createElement("h3");
        title.textContent = recipe.name;

        const meta = document.createElement("p");
        meta.className = "recipe-card-meta";
        meta.textContent = recipe.category || "Sin categoría";

        const servings = document.createElement("p");
        servings.className = "recipe-card-servings";
        if (recipe.servings && (recipe.servings.children || recipe.servings.adults)) {
          servings.textContent =
            (recipe.servings.children ? recipe.servings.children + " niño(s)" : "") +
            (recipe.servings.children && recipe.servings.adults ? " · " : "") +
            (recipe.servings.adults ? recipe.servings.adults + " adulto(s)" : "");
        } else {
          servings.textContent = "Porciones no especificadas";
        }

        const button = document.createElement("a");
        button.className = "btn btn-small";
        button.textContent = "Ver receta";
        button.href = "receta.html?slug=" + encodeURIComponent(recipe.slug);

        card.appendChild(title);
        card.appendChild(meta);
        card.appendChild(servings);
        card.appendChild(button);

        grid.appendChild(card);
      });
    }

    document.addEventListener("DOMContentLoaded", loadRecipes);
  </script>
  <script src="js/auth.js"></script>
</body>

</html>
