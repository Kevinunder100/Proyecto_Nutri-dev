<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Receta - NutriChef</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <header class="navbar">
    <div class="container">
      <div class="nav-logo">
        <img src="img/logo.png">
        <span>Nutri</span>
      </div>

      <nav class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="menu.html">Recetas</a>
        <a href="planes.html">Planes</a>
        <a href="recursos.html">Recursos</a>
      </nav>

      <div class="nav-actions">
        <a href="login.html" class="btn btn-outline">Log Out</a>
      </div>
    </div>
  </header>

  <main class="recipe-page">
    <div class="container">
      <a href="#" class="back-button" onclick="goBack(event)">← Volver</a>

      <div class="recipe-header" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <!-- Título dinámico -->
          <h1 id="recipe-title" style="margin: 0;">Cargando receta...</h1>
          <!-- Puedes usar texto fijo o luego conectar esto a otra propiedad -->
          <p id="recipe-subtitle">
            Una receta nutritiva para disfrutar en familia.
          </p>
        </div>
        <button id="fav-btn" class="btn btn-outline"
          style="display: none; border-radius: 50%; width: 50px; height: 50px; padding: 0; font-size: 24px;">
          🤍
        </button>
      </div>

      <div class="recipe-hero">
        <div class="recipe-image">
          Imagen del platillo
        </div>
      </div>

      <div class="recipe-layout">
        <section class="ingredients-card">
          <div class="ingredients-header">
            <h2>Ingredientes</h2>

            <!-- 🎚 Controles de porción -->
            <div class="portion-controls">
              <label>
                Tipo de porción:
                <select id="portion-type">
                  <option value="children">Niño</option>
                  <option value="adults">Adulto</option>
                </select>
              </label>

              <label>
                Cantidad:
                <select id="portion-count">
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                  <option value="6">6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                  <option value="9">9</option>
                  <option value="10">10</option>
                </select>
              </label>
            </div>
          </div>

          <p id="servings-text"></p>

          <ul id="ingredients-list">
            <!-- Ingredientes se llenan dinámicamente -->
          </ul>
        </section>

        <section class="video-card">
          <div class="video-placeholder">
            Área para video / reproducción
          </div>
        </section>
      </div>

      <section class="steps-section">
        <h2>Pasos</h2>

        <div id="steps-list">
          <!-- Pasos se llenan dinámicamente -->
        </div>
      </section>
    </div>
  </main>

  <script>
    let currentPortionType = "children";
    let currentPortionCount = 1;
    let currentRecipe = null;

    // ... (Helper functions remain same: parseNumber, getBaseQuantity) ...
    function parseNumber(value) {
      if (value === null || value === undefined || value === "") return null;
      if (typeof value === "number") return value;
      const n = parseFloat(value);
      return isNaN(n) ? null : n;
    }

    function getBaseQuantity(ing, portionType) {
      const raw = portionType === "children" ? ing.quantity_children : ing.quantity_adults;
      return parseNumber(raw);
    }

    function updateServingsText(recipe) {
      const servingsText = document.getElementById("servings-text");
      const typeLabel = currentPortionType === "children" ? "niño" : "adulto";
      servingsText.textContent = `Calculado para ${currentPortionCount} porción(es) de ${typeLabel}.`;
    }

    function renderIngredients() {
      if (!currentRecipe) return;

      const ingList = document.getElementById("ingredients-list");
      ingList.innerHTML = "";

      (currentRecipe.ingredients || []).forEach(function (ing) {
        const base = getBaseQuantity(ing, currentPortionType);
        const unit = ing.unit || "";

        let textAmount = "";
        if (base !== null) {
          const total = base * currentPortionCount;
          const display = Number.isInteger(total) ? total : total.toFixed(2);
          textAmount = display + " " + unit;
        }

        const li = document.createElement("li");
        li.textContent = ing.name + (textAmount ? " (" + textAmount + ")" : "");
        ingList.appendChild(li);
      });

      updateServingsText(currentRecipe);
    }

    function setupPortionControls() {
      const typeSelect = document.getElementById("portion-type");
      const countSelect = document.getElementById("portion-count");

      typeSelect.addEventListener("change", () => {
        currentPortionType = typeSelect.value;
        renderIngredients();
      });

      countSelect.addEventListener("change", () => {
        currentPortionCount = parseInt(countSelect.value, 10) || 1;
        renderIngredients();
      });
    }

    async function loadRecipe() {
      try {
        const params = new URLSearchParams(window.location.search);
        const slug = params.get("slug");

        if (!slug) {
          document.getElementById("recipe-title").textContent = "Receta no encontrada";
          return;
        }

        const res = await fetch("/api/recipes/" + encodeURIComponent(slug));
        if (!res.ok) throw new Error("Error fetching");

        const recipe = await res.json();
        currentRecipe = recipe;

        document.title = recipe.name + " - NutriChef";
        document.getElementById("recipe-title").textContent = recipe.name;
        if (recipe.category) {
          document.getElementById("recipe-subtitle").textContent = "Categoría: " + recipe.category;
        }

        renderIngredients();

        // Render Steps
        const stepsContainer = document.getElementById("steps-list");
        stepsContainer.innerHTML = "";
        (recipe.method || []).forEach(function (step, index) {
          const div = document.createElement("div");
          div.className = "step-card";

          const number = document.createElement("div");
          number.className = "step-number";
          number.textContent = index + 1;

          const content = document.createElement("div");
          content.className = "step-content";
          content.textContent = step;

          div.appendChild(number);
          div.appendChild(content);
          stepsContainer.appendChild(div);
        });

        return recipe;
      } catch (err) {
        console.error(err);
        document.getElementById("recipe-title").textContent = "Error al cargar la receta";
        return null;
      }
    }

    function goBack(e) {
      e.preventDefault();
      if (document.referrer.includes(window.location.host)) {
        history.back();
      } else {
        window.location.href = 'menu.html';
      }
    }

    async function checkFavorite(recipeId) {
      const token = localStorage.getItem('token');
      if (!token) return;

      const btn = document.getElementById('fav-btn');
      btn.style.display = 'block'; // Show button if logged in

      try {
        const res = await fetch(`/api/favorites/${recipeId}/check`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        updateFavBtn(data.isFavorite);

        btn.onclick = () => toggleFavorite(recipeId, data.isFavorite);
      } catch (err) {
        console.error(err);
      }
    }

    function updateFavBtn(isFav) {
      const btn = document.getElementById('fav-btn');
      btn.textContent = isFav ? '❤️' : '🤍';
      btn.title = isFav ? 'Quitar de favoritos' : 'Agregar a favoritos';
    }

    async function toggleFavorite(recipeId, isFav) {
      const token = localStorage.getItem('token');
      if (!token) return;

      const method = isFav ? 'DELETE' : 'POST';
      const url = isFav ? `/api/favorites/${recipeId}` : '/api/favorites';
      const body = isFav ? null : JSON.stringify({ recipeId });

      try {
        const res = await fetch(url, {
          method,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body
        });

        if (res.ok) {
          // Re-check to update state correctly
          checkFavorite(recipeId);
        }
      } catch (err) {
        console.error(err);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      setupPortionControls();
      loadRecipe().then(recipe => {
        if (recipe && recipe.id) checkFavorite(recipe.id);
      });
    });
  </script>
  <script src="js/auth.js"></script>
</body>

</html>
