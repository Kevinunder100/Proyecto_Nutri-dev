<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Iniciar Sesión - NutriChef</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <header class="navbar">
    <div class="container">
      <div class="nav-logo">
        <img src="img/logo.png">
        <span>Nutri</span>
      </div>

      <nav class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="menu.html">Recetas</a>
        <a href="planes.html">Planes</a>
        <a href="recursos.html">Recursos</a>
      </nav>

      <div class="nav-actions">
        <a href="login.html" class="btn btn-outline">Ingresar</a>
        <a href="registrar.html" class="btn btn-primary">Crear cuenta</a>
      </div>
    </div>
  </header>

  <main class="form-page">
    <div class="container form-card-wrapper">
      <div class="form-card">
        <h1>¡Bienvenido de nuevo! 👋</h1>
        <p>Ingresa a tu cuenta para ver tus planes.</p>

        <form>
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="ejemplo@correo.com" required />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required />
          </div>

          <button type="submit" class="btn btn-primary btn-block">Iniciar Sesión</button>
        </form>

        <small>
          ¿No tienes una cuenta? <a href="registrar.html">Regístrate aquí</a>.
        </small>
      </div>
    </div>
  </main>
  <script>
    const loginForm = document.querySelector('form');
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('token', data.token);
          window.location.href = '/index.html';
        } else {
          alert(data.error || 'Login failed');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('An error occurred');
      }
    });
  </script>
</body>

</html>
